<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>

    <section>
        <form action="" method="get">
            <fieldset>
                <!-- DADOS PESSOAIS -->

                
                <legend>Dados Pessoais</legend>
                
                <label for="userName">Nome</label>
                <input type="text" name="userName" required>
                <br>
                <label for="age">Idade</label>
                <input type="number" name="userAge" min="12"    max="100" required>
                <br>
                <label for="birthDate">Data de nascimento</label>
                <input type="date" name="birthDate">
                <br>
                <label for="userEmail">Email</label>
                <input type="email" name="userEmail" required>
                <br>
                <label for="userPhoneNumber">Telefone</label>
                <input type="tel" name="userPhoneNumber" pattern="  [0-9]{11}" placeholder="DDD + número sem espaço">
                <br>
                <label for="userImage">Upload de foto</label>
                <input type="file" accept="image/*" name="UserImage">
                <br>
            </fieldset> 

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>

                <input type="radio" name="userGender" value="Feminino">
                <label for="userGender">Feminino</label>

                <input type="radio" name="userGender" value="Masculino">
                <label for="userGender">Masculino</label>

                <input type="radio" name="userGender" value="notInformed">
                <label for="userGender">Prefiro não informar</label>

                <label for="maritalStatus">Estado civil</label>

                <select name="maritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="uniaoEstavel">União estável</option>
                </select>

                <label for="userState">Estado: </label>
                <select name="userState">
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapa</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceara</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goias</option>
                    <option value="maranhao">Maranhao</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="matoGrossodoSul">MatoGrosso do Sul</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Para</option>
                    <option value="paraiba">Paraiba</option>
                    <option value="parana">Parana</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piaui</option>
                    <option value="riodeJaneiro">Riode Janeiro</option>
                    <option value="rioGrandedoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandedoSul">Rio Grandedo Sul</option>
                    <option value="rondonia">Rondonia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">Sao Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>

                    <label for="userCity">Cidade:</label>
                    <input type="text" id="userCity" name="userCity" placeholder="Ex.: Fortaleza" />
                </select>
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>

                <p>Redes Sociais:</p>

                <input type="checkbox" name="social" value="instagram">
                <label for="social">Instagram</label>

                <br>

                <input type="checkbox" name="social" value="Facebook">
                <label for="social">Fecebook</label>

                <br>

                <input type="checkbox" name="social" value="Linkedin">
                <label for="social">Linkedin</label>

                <br>

                <input type="checkbox" name="social" value="X">
                <label for="social">X</label>
            </fieldset>
            
            <button type="submit">Enviar</button>
        </form>
    </section>

    <main>

    </main>
    <footer>

    </footer>
</body>
</html>
